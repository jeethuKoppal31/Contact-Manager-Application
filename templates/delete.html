{% extends 'base.html' %}
{% block content %}

<div class="container mt-5 text-center">
    <div class="card shadow p-4">
        <h3 class="text-danger mb-4">⚠ Are you sure you want to delete this contact?</h3>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
            <a href="{% url 'contactview' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
